name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_PRICE_ID_PRO: price_placeholder
      ANTHROPIC_API_KEY: sk-ant-placeholder
      OPENAI_API_KEY: sk-placeholder
      EVOLUTION_WEBHOOK_SECRET: e2e-placeholder-secret-with-32-characters
      CRON_SECRET: e2e-placeholder-cron-secret
      SUPABASE_ENVIRONMENT: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase
        run: npx --no-install supabase start
      - name: Configure local credentials and E2E account
        run: node scripts/setup-ci-supabase.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop --no-backup
